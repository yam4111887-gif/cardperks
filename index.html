<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>卡優惠 CardPerks — 互動原型</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root {
    --ink: #1e293b;
    --sub: #64748b;
    --line: #e2e8f0;
    --bg: #f4f5fa;
    --brand: #4f46e5;
    --brand2: #7c3aed;
    --ok: #059669;
    --warn: #d97706;
    --danger: #e11d48;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "PingFang TC", "Microsoft JhengHei", system-ui, -apple-system, sans-serif;
    background: #23233a; color: var(--ink);
    display: flex; justify-content: center; align-items: stretch;
  }
  .phone {
    width: 100%; max-width: 430px; height: 100dvh;
    background: var(--bg); display: flex; flex-direction: column;
    overflow: hidden; position: relative;
  }
  @media (min-width: 480px) {
    body { padding: 18px 0; }
    .phone { height: min(880px, calc(100dvh - 36px)); border-radius: 28px; box-shadow: 0 24px 60px rgba(0,0,0,.45); border: 1px solid #3a3a55; }
  }

  /* ---------- Header ---------- */
  header {
    background: linear-gradient(120deg, var(--brand), var(--brand2));
    color: #fff; padding: 14px 16px 12px; flex: none; z-index: 30;
  }
  .hd-row { display: flex; align-items: center; gap: 8px; }
  .logo { font-size: 19px; font-weight: 800; letter-spacing: .5px; }
  .logo small { font-weight: 500; opacity: .75; font-size: 11px; margin-left: 6px; }
  .pro-chip {
    background: linear-gradient(90deg,#fbbf24,#f59e0b); color: #451a03;
    font-size: 10px; font-weight: 800; border-radius: 999px; padding: 3px 8px; display: none;
  }
  .pro-chip.on { display: inline-block; }
  .hd-spacer { flex: 1; }
  .bell {
    background: rgba(255,255,255,.18); border: none; color: #fff; font-size: 16px;
    width: 34px; height: 34px; border-radius: 10px; cursor: pointer; position: relative;
  }
  .bell .dot {
    position: absolute; top: 5px; right: 6px; width: 8px; height: 8px; border-radius: 50%;
    background: #f87171; border: 2px solid transparent; box-shadow: 0 0 0 2px rgba(79,70,229,.9);
  }
  .seg {
    margin-top: 12px; background: rgba(255,255,255,.16); border-radius: 12px;
    display: flex; padding: 3px; font-size: 13px;
  }
  .seg button {
    flex: 1; border: none; background: transparent; color: #e0e7ff;
    padding: 7px 0; border-radius: 10px; cursor: pointer; font-weight: 600; transition: .15s;
  }
  .seg button.on { background: #fff; color: var(--brand); box-shadow: 0 2px 6px rgba(0,0,0,.18); }

  /* ---------- Main ---------- */
  main { flex: 1; overflow-y: auto; padding: 14px 14px 20px; }
  .view { display: none; animation: fade .18s ease; }
  .view.on { display: block; }
  @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .note {
    background: #eef2ff; border: 1px dashed #c7d2fe; color: #4338ca;
    border-radius: 12px; padding: 8px 12px; font-size: 12px; margin-bottom: 12px; line-height: 1.5;
  }
  .disc { color: var(--sub); font-size: 10.5px; text-align: center; margin-top: 14px; line-height: 1.6; }

  /* ---------- Bottom nav ---------- */
  nav {
    flex: none; display: flex; background: #fff; border-top: 1px solid var(--line);
    padding: 6px 4px calc(8px + env(safe-area-inset-bottom)); z-index: 30;
  }
  nav button {
    flex: 1; border: none; background: none; color: var(--sub);
    font-size: 10.5px; display: flex; flex-direction: column; align-items: center; gap: 3px;
    cursor: pointer; padding: 4px 0; border-radius: 10px;
  }
  nav button .ico { line-height: 1; }
  nav button .ico svg { width: 22px; height: 22px; display: block; margin: 0 auto; }
  nav button.on { color: var(--brand); font-weight: 700; }
  .bell svg { width: 17px; height: 17px; vertical-align: -3px; }
  .lico { display: inline-flex; vertical-align: -2px; margin-right: 5px; }
  .lico svg { width: 15px; height: 15px; }

  /* ---------- Cards / tiles ---------- */
  .panel { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin-bottom: 12px; }
  .panel h3 { font-size: 15px; margin-bottom: 10px; }
  .muted { color: var(--sub); font-size: 12px; }
  .row { display: flex; align-items: center; gap: 10px; }

  .cardtile {
    width: 52px; height: 34px; border-radius: 8px; flex: none;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 10.5px; font-weight: 800; letter-spacing: .5px;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.25);
  }
  .bankname { font-size: 11px; color: var(--sub); }
  .cardtitle { font-weight: 700; font-size: 14px; }

  .offerrow {
    background: #fff; border: 1px solid var(--line); border-radius: 14px;
    padding: 12px; margin-bottom: 10px;
  }
  .ratebadge {
    background: #ecfdf5; color: var(--ok); border: 1px solid #a7f3d0;
    font-weight: 800; font-size: 13px; border-radius: 8px; padding: 3px 8px; white-space: nowrap;
  }
  .paytag {
    display: inline-block; background: #fef3c7; color: #92400e; border: 1px solid #fde68a;
    font-size: 10.5px; border-radius: 999px; padding: 2px 8px; margin-right: 4px;
  }
  .tag {
    display: inline-block; font-size: 10.5px; border-radius: 999px; padding: 2px 8px; margin-right: 4px;
    background: #f1f5f9; color: var(--sub);
  }
  .have { color: var(--ok); font-size: 11px; font-weight: 700; }
  .nothave { color: var(--sub); font-size: 11px; }
  .est { font-size: 12px; color: var(--ink); }
  .est b { color: var(--brand); font-size: 14px; }
  .btn {
    border: none; border-radius: 10px; padding: 8px 14px; font-size: 12.5px; font-weight: 700;
    cursor: pointer; background: var(--brand); color: #fff;
  }
  .btn.ghost { background: #eef2ff; color: var(--brand); }
  .btn.gray { background: #f1f5f9; color: var(--sub); }
  .btn.block { width: 100%; padding: 12px; font-size: 14px; }
  .btn.warn { background: var(--warn); }
  .xbtn { border: none; background: #f1f5f9; color: var(--sub); border-radius: 8px; width: 26px; height: 26px; cursor: pointer; font-size: 13px; flex: none; }

  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
  .chip {
    border: 1px solid var(--line); background: #fff; color: var(--sub);
    border-radius: 999px; padding: 6px 12px; font-size: 12px; cursor: pointer;
  }
  .chip.on { background: var(--brand); border-color: var(--brand); color: #fff; font-weight: 700; }

  .searchbar { display: flex; gap: 8px; }
  .searchbar input[type=text] {
    flex: 1; border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; font-size: 14px; outline: none;
  }
  .searchbar input[type=text]:focus { border-color: var(--brand); }
  .amtrow { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 12.5px; color: var(--sub); }
  .amtrow input {
    width: 90px; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 14px; outline: none;
  }

  .merchant-head { display:flex; align-items:center; gap:8px; margin: 14px 2px 8px; font-weight: 800; font-size: 14px; }
  .merchant-head .cnt { font-size: 11px; color: var(--sub); font-weight: 500; }

  /* ---------- Progress (free quota) ---------- */
  .quota { margin-bottom: 4px; }
  .bar { height: 7px; background: #e2e8f0; border-radius: 99px; overflow: hidden; margin-top: 6px; }
  .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--brand), var(--brand2)); border-radius: 99px; }

  /* ---------- Map ---------- */
  #map { height: 340px; border-radius: 16px; border: 1px solid var(--line); z-index: 1; }
  .maplegend { font-size: 11px; color: var(--sub); margin-top: 8px; line-height: 1.6; }
  .pin {
    background: var(--brand); color: #fff; font-size: 11px; font-weight: 800;
    border-radius: 999px 999px 999px 2px; padding: 5px 9px; transform: rotate(-2deg);
    box-shadow: 0 3px 8px rgba(79,70,229,.4); border: 2px solid #fff; text-align: center; white-space: nowrap;
  }
  .pop-offer { border-top: 1px solid var(--line); padding: 7px 0; font-size: 12px; }
  .pop-offer:first-of-type { border-top: none; }
  .leaflet-popup-content { font-family: inherit; margin: 10px 12px; }

  /* ---------- Pro page ---------- */
  .pricehero {
    background: linear-gradient(120deg,#1e1b4b,#4c1d95); color:#fff; border-radius: 18px;
    padding: 18px; text-align: center; margin-bottom: 12px;
  }
  .pricehero .plan { font-size: 13px; opacity: .8; }
  .pricehero .price { font-size: 34px; font-weight: 800; margin: 6px 0 2px; }
  .pricehero .per { font-size: 12px; opacity: .75; }
  table.cmp { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table.cmp th, table.cmp td { padding: 9px 6px; text-align: center; border-bottom: 1px solid var(--line); }
  table.cmp th:first-child, table.cmp td:first-child { text-align: left; color: var(--sub); }
  table.cmp .yes { color: var(--ok); font-weight: 800; }
  table.cmp .no { color: #cbd5e1; }
  table.cmp td:nth-child(3) { background: #f5f3ff; font-weight: 700; }

  /* ---------- Modal / toast ---------- */
  #modal-root { position: absolute; inset: 0; z-index: 50; display: none; }
  #modal-root.on { display: block; }
  .mask { position: absolute; inset: 0; background: rgba(15,23,42,.55); }
  .sheet {
    position: absolute; left: 0; right: 0; bottom: 0; background: #fff;
    border-radius: 22px 22px 0 0; padding: 18px 16px calc(20px + env(safe-area-inset-bottom));
    max-height: 82%; overflow-y: auto; animation: up .22s ease;
  }
  @keyframes up { from { transform: translateY(40px); opacity: .4; } to { transform: none; opacity: 1; } }
  .sheet h3 { font-size: 16px; margin-bottom: 4px; }
  .sheet .sub { font-size: 12px; color: var(--sub); margin-bottom: 12px; }
  .listitem {
    display: flex; align-items: center; gap: 10px; padding: 11px 4px; border-bottom: 1px solid var(--line);
  }
  .listitem:last-child { border-bottom: none; }
  .payhero { background: linear-gradient(120deg,#4c1d95,#7c3aed); border-radius: 16px; color: #fff; padding: 16px; margin-bottom: 12px; }
  .payhero h3 { color: #fff; }
  .payhero ul { margin: 10px 0 0 18px; font-size: 13px; line-height: 1.9; }
  .toast {
    position: absolute; left: 50%; bottom: 92px; transform: translateX(-50%);
    background: #1e293b; color: #fff; font-size: 12.5px; border-radius: 999px;
    padding: 10px 18px; opacity: 0; pointer-events: none; transition: .25s; z-index: 60; white-space: nowrap; max-width: 92%;
  }
  .toast.on { opacity: .96; }
  .lockrow { filter: blur(3px); pointer-events: none; user-select: none; }
  .empty { text-align: center; color: var(--sub); font-size: 13px; padding: 26px 10px; line-height: 1.8; }
  .days { font-size: 11px; color: var(--warn); font-weight: 700; }
  .daysover { font-size: 11px; color: var(--danger); font-weight: 700; }
  .legalinks { text-align: center; font-size: 12px; margin-top: 6px; }
  .legalinks button {
    background: none; border: none; color: var(--brand); cursor: pointer;
    font-size: 12px; padding: 4px 6px; text-decoration: underline;
  }
  .legalbody { font-size: 12.5px; line-height: 1.8; color: var(--ink); max-height: 52vh; overflow-y: auto; padding-right: 6px; }
  .legalbody h4 { font-size: 13px; margin: 12px 0 4px; color: var(--brand); }
  .legalbody p, .legalbody li { color: var(--sub); }
  .legalbody ul { margin-left: 18px; }
  .consentbox {
    border: 1px solid var(--line); border-radius: 12px; padding: 12px;
    background: #f8fafc; font-size: 12.5px; color: var(--sub); line-height: 1.8; margin: 10px 0;
  }
  .consentbox label { display: flex; gap: 8px; align-items: flex-start; cursor: pointer; color: var(--ink); font-weight: 600; }
  .consentbox input { margin-top: 4px; }
  .srclink { font-size: 11px; color: var(--brand); text-decoration: none; white-space: nowrap; }
  .srclink:hover { text-decoration: underline; }
  .badge-live { background: #d1fae5; color: #065f46; border: 1px solid #a7f3d0; font-size: 10px; border-radius: 999px; padding: 2px 8px; font-weight: 700; }

  /* ---------- 引導頁 ---------- */
  #onboard {
    position: absolute; inset: 0; z-index: 70; display: none;
    background: linear-gradient(150deg, #312e81, #6d28d9 55%, #a21caf);
    color: #fff; flex-direction: column; padding: 18px 22px calc(16px + env(safe-area-inset-bottom));
  }
  #onboard.on { display: flex; animation: fade .25s ease; }
  .ob-top { display: flex; justify-content: flex-end; }
  .ob-skip {
    background: rgba(255,255,255,.16); border: none; color: #e0e7ff;
    border-radius: 999px; padding: 7px 16px; font-size: 12.5px; cursor: pointer;
  }
  .ob-hero { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 6px; }
  .ob-icon {
    width: 88px; height: 88px; border-radius: 26px; background: rgba(255,255,255,.14);
    display: flex; align-items: center; justify-content: center; margin-bottom: 12px;
    box-shadow: 0 14px 34px rgba(0,0,0,.28);
  }
  .ob-icon svg { width: 42px; height: 42px; }
  .ob-hero h2 { font-size: 23px; font-weight: 800; letter-spacing: .5px; }
  .ob-hero p { font-size: 13.5px; line-height: 1.9; opacity: .88; max-width: 290px; }
  .ob-hero .hint { font-size: 12px; opacity: .65; margin-top: 10px; }
  .ob-dots { display: flex; gap: 6px; justify-content: center; margin: 4px 0 14px; }
  .ob-dots i { width: 7px; height: 7px; border-radius: 99px; background: rgba(255,255,255,.32); transition: .2s; }
  .ob-dots i.on { background: #fff; width: 20px; }
  #onboard .btn-w {
    background: #fff; color: var(--brand); border: none; border-radius: 14px;
    padding: 14px; font-size: 15px; font-weight: 800; width: 100%; cursor: pointer;
    box-shadow: 0 10px 24px rgba(0,0,0,.25);
  }
  #onboard .btn-w:disabled { opacity: .45; box-shadow: none; cursor: not-allowed; }
  #onboard .btn-w.ghost { background: rgba(255,255,255,.12); color: #fff; box-shadow: none; margin-top: 9px; }
  .ob-pickwrap { flex: 1; display: flex; flex-direction: column; overflow-y: auto; }
  .ob-pickhead { text-align: center; margin: 6px 0 12px; }
  .ob-pickhead h2 { font-size: 20px; }
  .ob-pickhead p { font-size: 12.5px; opacity: .8; margin-top: 4px; }
  .pickgrid { display: flex; flex-wrap: wrap; gap: 9px; justify-content: center; padding: 0 2px; }
  .pick {
    border: 1.5px solid rgba(255,255,255,.35); background: rgba(255,255,255,.09); color: #fff;
    border-radius: 12px; padding: 10px 13px; font-size: 12.5px; cursor: pointer; display: flex; align-items: center; gap: 7px;
  }
  .pick .cardtile { width: 40px; height: 26px; font-size: 9px; }
  .pick.on { background: #fff; color: var(--brand); font-weight: 700; border-color: #fff; }
  .pick.on .cardtile { box-shadow: none; outline: 2px solid var(--brand); }
  .hd-help {
    background: rgba(255,255,255,.18); border: none; color: #fff; font-size: 13px; font-weight: 800;
    width: 34px; height: 34px; border-radius: 10px; cursor: pointer;
  }
  .linklike { background: none; border: none; color: var(--brand); text-decoration: underline; cursor: pointer; font-size: inherit; padding: 0; }
</style>
</head>
<body>
<div class="phone" id="phone">
  <header>
    <div class="hd-row">
      <span class="logo">卡優惠<small>CardPerks · 原型</small></span>
      <span class="pro-chip" id="proChip">PRO</span>
      <span class="hd-spacer"></span>
      <button class="hd-help" id="userBtn" aria-label="帳號">👤</button>
      <button class="hd-help" id="helpBtn" aria-label="引導">？</button>
      <button class="bell" id="bellBtn" aria-label="提醒"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span class="dot"></span></button>
    </div>
    <div class="seg" id="segToggle">
      <button data-mode="mine" class="on">只看我的卡</button>
      <button data-mode="all">顯示全部卡</button>
    </div>
  </header>

  <main id="main">
    <!-- 卡簿 -->
    <section class="view on" id="view-cards"></section>
    <!-- 搜尋 -->
    <section class="view" id="view-search"></section>
    <!-- 地圖 -->
    <section class="view" id="view-map"></section>
    <!-- 優惠 -->
    <section class="view" id="view-offers"></section>
    <!-- Pro -->
    <section class="view" id="view-pro"></section>
  </main>

  <nav id="nav">
    <button data-v="cards" class="on"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg></span>卡簿</button>
    <button data-v="search"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>搜尋</button>
    <button data-v="map"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg></span>地圖</button>
    <button data-v="offers"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="4" rx="1"/><line x1="12" y1="8" x2="12" y2="21"/><path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5C11 3 12 8 12 8s1-5 4.5-5a2.5 2.5 0 0 1 0 5"/></svg></span>優惠</button>
    <button data-v="pro"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26"/></svg></span>Pro</button>
  </nav>

  <div id="modal-root"></div>
  <div class="toast" id="toast"></div>
  <div id="onboard"></div>
</div>

<script>
/* =========================================================
   卡優惠 CardPerks — 單檔互動原型
   所有銀行／卡片／優惠資料皆為「示範資料」，非即時資訊。
   ========================================================= */

// 內容區塊用線條圖示（Lucide 風格）
const I = {
  card: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>',
  bell: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>',
  file: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>',
  spark: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.8a2 2 0 0 0 1.3 1.3L21 12l-5.8 1.9a2 2 0 0 0-1.3 1.3L12 21l-1.9-5.8a2 2 0 0 0-1.3-1.3L3 12l5.8-1.9a2 2 0 0 0 1.3-1.3z"/></svg>',
  pin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>',
  cal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>',
  inf: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18.178 8c5.096 0 5.096 8 0 8-5.095 0-7.133-8-12.739-8-4.585 0-4.585 8 0 8 5.606 0 7.644-8 12.74-8z"/></svg>',
};

// ---------- 小工具 ----------
const $ = (s) => document.querySelector(s);
const card = (id) => CARDS.find(c => c.id === id);
const bank = (id) => BANKS[card(id).bank];
const merch = (id) => MERCHANTS.find(m => m.id === id);
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function tile(id, w, h) {
  const b = bank(id);
  return `<div class="cardtile" style="width:${w||52}px;height:${h||34}px;background:linear-gradient(135deg,${b.grad[0]},${b.grad[1]})">${b.short}</div>`;
}
function daysLeft(end) {
  return Math.ceil((new Date(end + 'T23:59:59') - new Date()) / 86400000);
}
function fmtMoney(n) {
  return '$' + Math.round(n).toLocaleString('zh-TW');
}
function estRebate(o, amount) {
  const raw = amount * o.rate / 100;
  return o.cap > 0 ? Math.min(raw, o.cap) : raw;
}
function offersOfMerchant(mid) {
  return OFFERS.filter(o => o.m === mid && daysLeft(o.end) >= 0);
}
function myOffers() {
  return OFFERS.filter(o => state.myCards.includes(o.card) && daysLeft(o.end) >= 0);
}

let toastTimer;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('on'), 2200);
}

function openSheet(html) {
  $('#modal-root').innerHTML = `<div class="mask" onclick="closeSheet()"></div><div class="sheet">${html}</div>`;
  $('#modal-root').classList.add('on');
}
function closeSheet() {
  $('#modal-root').classList.remove('on');
  $('#modal-root').innerHTML = '';
}

      <div style="flex:1">

        <div class="bankname">${esc(bank(c.id).name)} · ${esc(c.base)}</div>

      <button class="btn" onclick="addCard('${c.id}')">加入</button>

    <p class="sub">只需選擇卡片名稱，無需卡號或其他個資</p>
    ${rows}

  if (!state.isPro && state.myCards.length >= FREE_LIMIT) {
    paywall('免費版最多登錄 5 張卡，升級 Pro 解鎖無限卡簿');
    return;
  }
  state.myCards.push(id);
  saveCards();
  if (localStorage.getItem('cp_token')) pushCard('add', id);
  closeSheet();
  renderAll();
  toast(`已加入 ${card(id).name}`);
}

  state.myCards = state.myCards.filter(x => x !== id);

  renderAll();
  toast(`已移除 ${card(id).name}`);
}

function renderSearch() {

  const chips = cats.map(c => `<button class="chip ${state.cat === c ? 'on' : ''}" onclick="setCat('${c}')">${c}</button>`).join('');

  let targets = MERCHANTS;
  if (state.cat !== '全部') targets = targets.filter(m => m.cat === state.cat);
  const q = state.query.trim().toLowerCase();
  if (q) targets = targets.filter(m => (m.name + ' ' + m.alias).toLowerCase().includes(q));

  const groups = targets.map(m => {
    let os = offersOfMerchant(m.id);
    if (state.mode === 'mine') os = os.filter(o => state.myCards.includes(o.card));
    os.sort((a, b) => estRebate(b, state.amount) - estRebate(a, state.amount));
    return { m, os };
  }).filter(g => g.os.length);

  const html = groups.map(({ m, os }) => `
    <div class="merchant-head">${esc(m.name)}<span class="cnt">${esc(m.cat)} · ${os.length} 筆優惠${state.mode === 'mine' ? '（我的卡）' : ''}</span></div>

  $('#view-search').innerHTML = `
    <div class="searchbar">

// ---------- 分享卡（canvas 生成圖片） ----------
function shareOffer(idx) {
  const o = OFFERS[idx];
  if (!o) return;
  const c = card(o.card), m = merch(o.m), b = bank(o.card);
  const cv = document.createElement('canvas');
  cv.width = 1080; cv.height = 1080;
  const ctx = cv.getContext('2d');

  const grad = ctx.createLinearGradient(0, 0, 1080, 1080);
  grad.addColorStop(0, '#312e81'); grad.addColorStop(.6, '#6d28d9'); grad.addColorStop(1, '#a21caf');
  ctx.fillStyle = grad; ctx.fillRect(0, 0, 1080, 1080);

  ctx.fillStyle = 'rgba(255,255,255,.9)';
  ctx.font = '600 44px "PingFang TC","Microsoft JhengHei",sans-serif';
  ctx.fillText('卡優惠 CardPerks', 72, 120);
  ctx.fillStyle = 'rgba(255,255,255,.55)';
  ctx.font = '400 30px sans-serif';
  ctx.fillText('結帳前查一下，刷對卡', 72, 172);

  // 銀行＋卡名
  ctx.fillStyle = 'rgba(255,255,255,.75)';
  ctx.font = '500 40px sans-serif';
  ctx.fillText(`${b.name} · ${c.name}`, 72, 330);

  // 大標：回饋率或折扣
  ctx.fillStyle = '#fff';
  ctx.font = '800 190px sans-serif';
  const big = o.rn || `${o.rate}%`;
  ctx.fillText(big, 68, 540);
  ctx.font = '600 46px sans-serif';
  ctx.fillText(o.rn ? '限時優惠' : '回饋', 74 + ctx.measureText(big).width * (o.rn ? 0.32 : 1.1) / 0.9, 530);

  // 商家
  ctx.fillStyle = '#fff';
  ctx.font = '700 64px sans-serif';
  ctx.fillText(m.name, 72, 680);
  ctx.fillStyle = 'rgba(255,255,255,.85)';
  ctx.font = '400 38px sans-serif';
  const conds = [o.pay !== '不限' ? `綁${o.pay}` : null, o.login ? '需登錄' : null,
                 o.cap ? `上限$${o.cap}` : null].filter(Boolean).join(' · ');
  ctx.fillText(`${o.end} 前有效${conds ? ' · ' + conds : ''}`, 72, 750);

  // 底部免責與來源
  ctx.fillStyle = 'rgba(255,255,255,.5)';
  ctx.font = '400 28px sans-serif';
  let host = '';
  try { host = new URL(o.source).hostname; } catch (e) { host = ''; }
  ctx.fillText(host ? `資料來源：${host}` : '資料來源：發卡銀行官網', 72, 960);
  ctx.fillText('實際權益以發卡銀行官方公告為準', 72, 1005);

  cv.toBlob(async (blob) => {
    if (!blob) { toast('圖片生成失敗'); return; }
    const file = new File([blob], 'cardperks.png', { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: '卡優惠 CardPerks' }); return; } catch (e) { /* 取消 */ }
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `cardperks_${o.card}_${o.m}.png`;
    a.click();
    toast('已下載分享圖（示意）');
  });
}

let mapObj = null, markerLayer = null;
function renderMap() {
  // 骨架只建一次，避免重寫 DOM 讓 Leaflet 實例失效
  if (!document.getElementById('map')) {
    $('#view-map').innerHTML = `
      <div id="map"></div>
      <p class="maplegend"></p>
    `;
  }
  $('#view-map .maplegend').innerHTML = `
    <span class="lico">${I.pin}</span>地圖顯示實體商家據點（網購／外送商家請用「搜尋」）。<br>
    標籤數字＝該門市目前的優惠筆數${state.mode === 'mine' ? '（僅統計你的卡）' : '（全部卡片）'}。點擊標籤看優惠明細。<br>
    <span class="muted">優惠以發卡銀行官方公告為準 · 圖資 © OpenStreetMap 貢獻者</span>
  `;
  setTimeout(initMap, 50);
}
function initMap() {
  if (typeof L === 'undefined') {
    $('#map').innerHTML = '<p class="empty">地圖元件載入失敗（需網路連線載入 Leaflet／圖資）</p>';
    return;
  }
  if (mapObj && (!mapObj.getContainer() || !mapObj.getContainer().isConnected)) {
    mapObj = null; markerLayer = null;  // 舊實例的容器已被移除，重建
  }
  if (!mapObj) {
    mapObj = L.map('map', { zoomControl: true }).setView([25.045, 121.54], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap', maxZoom: 19,
    }).addTo(mapObj);
    markerLayer = L.layerGroup().addTo(mapObj);
  }
  markerLayer.clearLayers();
  MERCHANTS.filter(m => !m.online).forEach(m => {
    m.locs.forEach(loc => {
      let os = offersOfMerchant(m.id);
      if (state.mode === 'mine') os = os.filter(o => state.myCards.includes(o.card));
      if (!os.length) return;
      const icon = L.divIcon({ html: `<div class="pin">${m.name.slice(0, 4)}<br>${os.length}</div>`, className: '', iconSize: [56, 40], iconAnchor: [28, 38] });
      L.marker([loc.lat, loc.lng], { icon })
        .bindPopup(popupHtml(m, loc, os))
        .addTo(markerLayer);
    });
  });
}
function popupHtml(m, loc, os) {
  const rows = os.slice(0, 4).map(o => `
    <div class="pop-offer">
      <b>${esc(card(o.card).name)}</b> <span class="nothave">${state.myCards.includes(o.card) ? '✓' : ''}</span><br>
      <span class="ratebadge" style="font-size:11px">${o.rate}%</span>
      ${o.pay !== '不限' ? `<span class="paytag">綁 ${esc(o.pay)}</span>` : ''}
      ${o.login ? '<span class="tag">需登錄</span>' : ''}
    </div>`).join('');
  return `<b>${esc(m.name)} ${esc(loc.n)}</b><div class="muted" style="margin:2px 0 6px">${esc(m.cat)} · ${os.length} 筆優惠</div>${rows}`;
}

        <li>你可隨時要求刪除所有分析結果（隱私權政策 §7）</li>
      </ul>
    </div>
    <button class="btn block" onclick="billCheckRun()">開始分析（模擬）</button>
    <button class="btn gray block" style="margin-top:8px" onclick="closeSheet()">取消</button>
  `);
}
function billCheckRun() {

  openSheet(`
    <h3><span class="lico">${I.file}</span>帳單健檢結果（模擬）</h3>
    <p class="sub">分析期間：2026 年 7 月 · 總消費 NT$28,450</p>
    <div class="panel" style="margin:10px 0">
      <div class="row" style="justify-content:space-around;text-align:center">
        <div><div class="muted">實拿回饋</div><div style="font-size:22px;font-weight:800">$393</div></div>
        <div><div class="muted">最佳化可拿</div><div style="font-size:22px;font-weight:800;color:var(--ok)">$1,240</div></div>
        <div><div class="muted">少賺</div><div style="font-size:22px;font-weight:800;color:var(--danger)">$847</div></div>

    </div>
    <h3 style="font-size:14px">前 3 大改善空間</h3>
    <div class="listitem"><div style="flex:1"><b>foodpanda 消費 $2,340</b><div class="muted">刷了 J 卡（1%）→ 改刷 @GoGo（3.8%）多賺 $65</div></div></div>
    <div class="listitem"><div style="flex:1"><b>全聯消費 $3,980</b><div class="muted">刷了 LINE Pay 卡 → 改刷 CUBE 登錄 5% 多賺 $132</div></div></div>
    <div class="listitem"><div style="flex:1"><b>momo 購物 $5,200</b><div class="muted">刷了 U Bear → 辦 momo 卡 5% 多賺 $312</div></div></div>
    <button class="btn block" style="margin-top:10px" onclick="closeSheet()">了解</button>
  `);
}

// ---------- 提醒（付費功能） ----------
function bellSheet() {
  if (!state.isPro) {
    openSheet(`
      <h3><span class="lico">${I.bell}</span>優惠提醒</h3>
      <div class="lockrow">
        ${REMINDERS.map(r => `<div class="listitem"><div style="flex:1"><div class="cardtitle">${esc(r.msg)}</div></div></div>`).join('')}
      </div>
      <div style="text-align:center;margin-top:10px">
        <p class="muted">到期／額度／登錄提醒是 Pro 功能</p>
        <button class="btn" onclick="paywall('解鎖推播提醒')">升級 Pro 解鎖</button>
      </div>
    `);
    return;
  }
  openSheet(`
    <h3><span class="lico">${I.bell}</span>我的提醒</h3>
    ${REMINDERS.map(r => `<div class="listitem"><div style="flex:1"><div class="cardtitle">${esc(r.msg)}</div></div></div>`).join('')}
    <button class="btn gray block" style="margin-top:10px" onclick="closeSheet()">關閉</button>
  `);
}

// ---------- 引導頁（首次登入） ----------
const OB_SEARCH_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>';
const OB_SLIDES = [
  { icon: I.card, title: '記下你的卡', desc: '只需選擇卡片名稱，<b>不用卡號、不用任何個資</b>。<br>免費版可登錄 5 張，Pro 無上限。' },
  { icon: OB_SEARCH_SVG, title: '結帳前，查一下', desc: '輸入商家與金額，立即比較你每張卡的<br>回饋金額、綁定支付與登錄條件。' },
  { icon: I.pin, title: '走到哪，優惠到哪', desc: '地圖顯示附近商家有哪些卡有優惠，<br>結帳前 30 秒不再猶豫。' },
];
let obStep = 0;
const obPicked = new Set();
function renderOb() {
  const el = $('#onboard');
  const total = 4;
  const dots = Array.from({ length: total }, (_, i) => `<i class="${i === obStep ? 'on' : ''}"></i>`).join('');
  const top = `<div class="ob-top"><button class="ob-skip" onclick="finishOb(true)">略過</button></div>`;
  if (obStep < 3) {
    const s = OB_SLIDES[obStep];
    el.innerHTML = `
      ${top}
      <div class="ob-hero">
        <div class="ob-icon">${s.icon}</div>
        <h2>${s.title}</h2>
        <p>${s.desc}</p>
      </div>
      <div class="ob-dots">${dots}</div>
      <button class="btn-w" onclick="obNext()">${obStep === 2 ? '選擇我的卡' : '下一步'}</button>
    `;
  } else {
    el.innerHTML = `
      ${top}
      <div class="ob-pickwrap">
        <div class="ob-pickhead"><h2>你手上有哪些卡？</h2><p>選 1 張以上即可開始（之後可隨時增刪）</p></div>
        <div class="pickgrid">
          ${CARDS.map(c => `
            <button class="pick ${obPicked.has(c.id) ? 'on' : ''}" onclick="obPick('${c.id}')">
              ${tile(c.id, 40, 26)}<span>${esc(c.name)}</span>
            </button>`).join('')}
        </div>
      </div>
      <div class="ob-dots">${dots}</div>
      <button class="btn-w" ${obPicked.size ? '' : 'disabled'} onclick="finishOb(false)">
        ${obPicked.size ? `開始使用（${obPicked.size} 張卡）` : `請至少選 1 張卡`}
      </button>
    `;
  }
}
function obNext() { obStep = Math.min(3, obStep + 1); renderOb(); }
function obPick(id) {
  if (!obPicked.has(id) && obPicked.size >= FREE_LIMIT && !state.isPro) {
    toast(`免費版最多選 ${FREE_LIMIT} 張（之後可升級 Pro）`);
    return;
  }
  obPicked.has(id) ? obPicked.delete(id) : obPicked.add(id);
  renderOb();
}
function finishOb(skipped) {
  if (!skipped && obPicked.size) {
    state.myCards = [...obPicked];
    saveCards();
  }
  try { localStorage.setItem('cp_onboarded', '1'); } catch (e) {}
  $('#onboard').classList.remove('on');
  renderAll();
  if (!state.myCards.length) toast('稍後可在「卡簿」新增卡片，或點右上「？」重看引導');
}
function showOnboarding(force) {
  if (!force && localStorage.getItem('cp_onboarded')) return;
  // 已有卡簿者直接跳到選卡步（預選現有卡）
  obStep = state.myCards.length ? 3 : 0;
  obPicked.clear();
  state.myCards.forEach(id => obPicked.add(id));
  renderOb();
  $('#onboard').classList.add('on');
}
$('#helpBtn').addEventListener('click', () => showOnboarding(true));

// ---------- 帳號（雲端同步；不登入也可完整使用，資料只在本機） ----------
const APIO = location.protocol.startsWith('http') ? location.origin : '';
function authHeaders() {
  const t = localStorage.getItem('cp_token');
  return t ? { 'Authorization': 'Bearer ' + t } : {};
}
async function apiFetch(path, opts = {}) {
  opts.headers = Object.assign({}, opts.headers || {}, authHeaders());
  return fetch(APIO + path, opts);
}
async function pushCard(op, slug) {
  try {
    if (op === 'add') await apiFetch('/api/me/cards', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ card_slug: slug }) });
    else await apiFetch('/api/me/cards/' + slug, { method: 'DELETE' });
  } catch (e) { /* 離線：僅本地 */ }
}
async function syncFromServer() {
  try {
    const r = await apiFetch('/api/me');
    const d = await r.json();
    if (!d.logged_in) { localStorage.removeItem('cp_token'); return false; }
    if (d.cards.length === 0 && state.myCards.length) {
      // 首次登入且伺服器空卡簿 → 把本機卡簿上傳（無縫接軌）
      for (const s of state.myCards) await pushCard('add', s);
    } else {
      state.myCards = d.cards.map(c => c.slug);
      saveCards();
    }
    return true;
  } catch (e) { return false; }
}
function accountSheet() {
  const email = localStorage.getItem('cp_email') || '';
  if (localStorage.getItem('cp_token')) {
    openSheet(`
      <h3>我的帳號</h3>
      <div class="panel" style="margin:8px 0">
        <div class="cardtitle">${esc(email)}</div>
        <div class="muted" style="margin-top:4px">✓ 卡簿雲端同步中——換裝置登入即無縫接軌</div>
      </div>
      <button class="btn gray block" onclick="doLogout()">登出</button>
    `);
    return;
  }
  openSheet(`
    <h3>登入／註冊</h3>
    <p class="sub">登入後卡簿雲端同步；不登入也可使用（資料僅存本機）</p>
    <div style="display:flex;flex-direction:column;gap:8px;margin:10px 0">
      <input type="email" id="accEmail" placeholder="email" style="border:1px solid var(--line);border-radius:10px;padding:11px;font-size:14px" value="${esc(email)}">
      <input type="password" id="accPw" placeholder="密碼（至少 6 碼）" style="border:1px solid var(--line);border-radius:10px;padding:11px;font-size:14px">
    </div>
    <button class="btn block" onclick="doAuth('login')">登入</button>
    <button class="btn ghost block" style="margin-top:8px" onclick="doAuth('register')">註冊新帳號</button>
  `);
}
async function doAuth(mode) {
  const email = (document.getElementById('accEmail').value || '').trim();
  const pw = document.getElementById('accPw').value || '';
  if (!email || !pw) { toast('請填 email 與密碼'); return; }
  try {
    const r = await fetch(APIO + '/api/auth/' + mode, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password: pw }),
    });
    const d = await r.json();
    if (!r.ok) { toast(d.detail || '操作失敗'); return; }
    localStorage.setItem('cp_token', d.token);
    localStorage.setItem('cp_email', d.email);
    closeSheet();
    await syncFromServer();
    renderAll();
    toast(mode === 'register' ? '註冊成功，卡簿已雲端同步' : '登入成功，已同步雲端卡簿');
  } catch (e) { toast('連線失敗（離線模式）'); }
}
async function doLogout() {
  try { await apiFetch('/api/auth/logout', { method: 'POST' }); } catch (e) {}
  localStorage.removeItem('cp_token');
  closeSheet();
  renderAll();
  toast('已登出（卡簿保留在本機）');
}
$('#userBtn').addEventListener('click', accountSheet);

// ---------- 導覽 ----------
function switchView(v) {
  state.view = v;
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  document.querySelectorAll('.view').forEach(s => s.classList.remove('on'));
  $('#view-' + v).classList.add('on');
  if (v === 'map') renderMap();  // 地圖內容為延遲渲染，進到分頁時才建
}
function renderAll() {
  renderCards(); renderSearch(); renderOffers(); renderPro();
  $('#proChip').classList.toggle('on', state.isPro);
  if (state.view === 'map') renderMap();
}

$('#nav').addEventListener('click', e => {
  const b = e.target.closest('button'); if (b) switchView(b.dataset.v);
});
$('#segToggle').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  state.mode = b.dataset.mode;
  $('#segToggle [data-mode=mine]').classList.toggle('on', state.mode === 'mine');
  $('#segToggle [data-mode=all]').classList.toggle('on', state.mode === 'all');
  renderAll();
});
$('#bellBtn').addEventListener('click', bellSheet);

// ---------- API 資料載入（後端 http 服務時自動換真資料；file:// 或離線時沿用示範資料） ----------
const API_BASE = location.protocol.startsWith('http') ? location.origin : '';
async function bootFromAPI() {
  if (!API_BASE) return false;
  try {
    const [cardsR, merchR, offersR] = await Promise.all([
      fetch(API_BASE + '/api/cards').then(r => r.json()),
      fetch(API_BASE + '/api/merchants').then(r => r.json()),
      fetch(API_BASE + '/api/offers').then(r => r.json()),
    ]);
    const PALETTE = [
      ['#475569', '#94a3b8'], ['#b91c1c', '#f87171'], ['#065f46', '#34d399'],
      ['#7e22ce', '#c084fc'], ['#9a3412', '#fb923c'], ['#0e7490', '#67e8f9'], ['#9d174d', '#f9a8d4'],
    ];
    let pi = Object.keys(BANKS).length;
    CARDS.length = 0;
    cardsR.forEach(c => {
      if (!BANKS[c.bank.code]) {
        BANKS[c.bank.code] = { name: c.bank.name, short: c.bank.short_name, grad: PALETTE[pi++ % PALETTE.length] };
      }
      CARDS.push({ id: c.slug, bank: c.bank.code, name: c.name, base: c.base_note || '' });
    });
    MERCHANTS.length = 0;
    merchR.forEach(m => MERCHANTS.push({
      id: m.slug, name: m.name, cat: m.category, online: m.is_online,
      alias: ((m.aliases || []).join(' ') + ' ' + m.name).toLowerCase(),
      locs: (m.locations || []).map(l => ({ n: l.name, lat: l.lat, lng: l.lng })),
    }));
    const PAY = { any: '不限', line_pay: 'LINE Pay', pi_wallet: 'Pi 拍錢包', tap: '行動支付', other: '限特定支付' };
    OFFERS.length = 0;
    offersR.items.forEach(o => {
      if (o.days_left < 0 || !o.merchant) return;
      OFFERS.push({
        card: o.card.slug, m: o.merchant.slug, rate: o.reward_rate,
        rn: o.reward_note || null, cap: o.monthly_cap || 0,
        login: o.requires_login, pay: PAY[o.pay_channel] || '不限',
        end: o.ends_on, sd: o.starts_on, note: (o.terms || '').slice(0, 80),
        full: o.terms || '', source: o.source_url, vd: o.verified_at,
        bankName: o.card.bank.name, cardName: o.card.name,
      });
    });
    // 卡簿初始值中已不在資料庫的卡自動剔除
    const validSlugs = new Set(CARDS.map(c => c.id));
    state.myCards = state.myCards.filter(id => validSlugs.has(id));
    return true;
  } catch (e) {
    console.warn('API 載入失敗，沿用內嵌示範資料', e);
    return false;
  }
}

renderAll();
bootFromAPI().then(async ok => {
  if (ok) {
    document.querySelector('.logo small').innerHTML = 'CardPerks <span class="badge-live">即時資料</span>';
  }
  if (localStorage.getItem('cp_token')) {
    await syncFromServer();  // 已登入 → 拉雲端卡簿
  }
  renderAll();
  if (state.view === 'map') renderMap();
  showOnboarding();  // 首次登入（或 API 就緒）後顯示引導
});
</script>
