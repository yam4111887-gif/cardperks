name: daily-pipeline

# 每天「台灣 08:00 與 20:00」各跑一次（GitHub 排程在高負載時可能跳過，雙時段保險；
# 管線全程冪等，重複執行無副作用）
on:
  schedule:
    - cron: '0 0 * * *'
    - cron: '0 12 * * *'
  workflow_dispatch: {}
  repository_dispatch:      # 外部排程服務（cron-job.org 等）經 API 叫醒用，最可靠
    types: [daily-pipeline]

permissions:
  contents: write   # 讓 cardperks-bot 能把每日報告提交回 repo

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 完整歷史：shallow clone 的 push 會被 GitHub 拒絕

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安裝依賴與爬蟲瀏覽器
        run: |
          pip install -r backend/requirements.txt playwright
          playwright install chromium --with-deps

      - name: 執行每日管線（寫入 Supabase）
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_PROVIDER: glm
        run: |
          python pipeline/daily.py
          python pipeline/export_static.py

      - name: 提交報告與待審資料回 repo
        env:
          PUSH_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/yam4111887-gif/cardperks.git
        run: |
          git config user.name "cardperks-bot"
          git config user.email "bot@users.noreply.github.com"
          # 先 commit 本地產出（管線會改寫已追蹤的 web/data，pull 前必須清工作區）
          # ⚠️ 只提交結構化結果與報告：快照(snapshots)與爬蟲原文(crawled_items)含銀行頁面
          # 完整內容，repo 已公開，重製文案有著作權風險——留在 runner 本地當日丟棄，不上傳
          git add web/data 2>/dev/null || true
          git add -f backend/pipeline/out/diff_report.md \
                    backend/pipeline/out/accuracy_report.md \
                    backend/pipeline/out/approved_offers.jsonl \
                    backend/pipeline/out/pending_offers.jsonl 2>/dev/null || true
          echo "--- staged 檔案 ---"
          git diff --cached --name-only
          git commit -m "daily: 爬取＋稽核報告＋靜態資料 $(date -u +%F)" || echo "今日無變更"
          git pull --rebase "$PUSH_URL" main
          git push "$PUSH_URL" HEAD:main
